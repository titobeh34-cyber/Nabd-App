<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نبض - مساعدك الطبي الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Cairo', sans-serif; 
      /* New professional medical background image */
      background-image: url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?q=80&w=2070&auto=format&fit=crop'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed; 
    }
    .overlay { 
      background-color: rgba(15, 23, 42, 0.85); /* slate-900 with 85% opacity */
    }
    .result-card { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    textarea:focus, input:focus, button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
      border-color: #3b82f6;
    }
    /* Loading Spinner Animation */
    .spinner {
      animation: spin 1s linear infinite;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6; /* blue-500 */
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-gray-200 min-h-screen">

<div class="overlay min-h-screen w-full flex items-center justify-center p-4 fixed inset-0">
  <div class="container mx-auto max-w-3xl w-full">
    <header class="text-center mb-6">
      <h1 class="text-3xl md:text-4xl font-bold text-white">نبض - مساعدك الطبي الذكي</h1>
      <p class="text-blue-300 mt-2">أدخل الأعراض للحصول على تحليل مبدئي</p>
    </header>

    <main class="bg-slate-900/60 p-6 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-sm">
      <div class="space-y-4">
        <div>
          <label for="message" class="block mb-2 font-semibold text-gray-300">الأعراض / اسم المرض</label>
          <textarea id="message" rows="3" class="w-full p-3 rounded-lg bg-slate-800/70 border border-slate-600 text-white transition placeholder-slate-400" placeholder="مثال: صداع نصفي أو حمى وسعال..."></textarea>
        </div>
        <div>
          <label for="city" class="block mb-2 font-semibold text-gray-300">المدينة (اختياري)</label>
          <input id="city" type="text" class="w-full p-3 rounded-lg bg-slate-800/70 border border-slate-600 text-white transition placeholder-slate-400" placeholder="مثال: القاهرة">
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button id="send" class="w-full bg-blue-600 hover:bg-blue-700 transition-colors py-3 px-5 rounded-lg font-bold text-white">تحليل الأعراض</button>
        <button id="geoBtn" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 transition-colors py-3 px-5 rounded-lg font-bold text-white flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>أقرب مستشفى</span>
        </button>
      </div>
      
      <div id="output" class="bg-slate-900/50 border border-slate-800 p-4 rounded-lg mt-6 min-h-[150px] text-gray-300 flex items-center justify-center">
        <p class="text-center text-slate-400">ستظهر النتائج هنا بعد التحليل...</p>
      </div>
    </main>

    <footer class="text-center mt-6 text-slate-400 text-sm">
      <p>© 2025 <span class="text-blue-400 font-semibold">نبض</span> | تصميم وتطوير بواسطة <span class="text-blue-500 font-bold">تيتو</span></p>
    </footer>
  </div>
</div>

<script>
  // --- CONFIG ---
  const API_BASE_URL = "https://vaccinal-fabiola-lucently.ngrok-free.dev";

  // --- DOM ELEMENTS ---
  const sendBtn = document.getElementById('send');
  const geoBtn = document.getElementById('geoBtn');
  const output = document.getElementById('output');
  const msgInput = document.getElementById('message');
  const cityInput = document.getElementById('city');

  // --- UTILITY FUNCTIONS ---
  const formatPhoneForTel = (phone) => {
    if (!phone) return "";
    let cleanPhone = phone.trim();
    if (/^0\d+/.test(cleanPhone)) return '+20' + cleanPhone.slice(1);
    if (/^\+/.test(cleanPhone)) return cleanPhone;
    return cleanPhone;
  };

  const openMapsForCity = (city) => {
    const query = encodeURIComponent(`مستشفيات ${city}`);
    window.open(`https://www.google.com/maps/search/${query}`, '_blank');
  };

  const findNearestHospitalByGeolocation = () => {
    if (!('geolocation' in navigator)) {
      renderError('تحديد الموقع غير مدعوم في متصفحك.');
      return;
    }
    renderLoading('جاري تحديد موقعك وفتح خرائط جوجل...');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        window.open(`https://www.google.com/maps/search/hospitals/@${lat},${lon},14z`, '_blank');
        renderInitial(); // Reset view after opening maps
      },
      err => {
        renderError('لم يتم السماح بتحديد الموقع أو حدث خطأ.');
      }
    );
  };

  // --- RENDER FUNCTIONS ---
  const renderLoading = (message = 'جاري التحليل...') => {
    output.innerHTML = `
      <div class="flex flex-col items-center justify-center gap-3">
        <div class="spinner"></div>
        <p class="text-center text-yellow-400">${message}</p>
      </div>
    `;
  };

  const renderError = (message) => {
    output.innerHTML = `<p class="text-center text-red-400">${message}</p>`;
  };
  
  const renderInitial = (message = 'النتائج ستظهر هنا بعد التحليل...') => {
    output.innerHTML = `<p class="text-center text-slate-400">${message}</p>`;
  };

  const createDiseaseCardHTML = (data) => {
    const city = cityInput.value.trim();
    const doctorsHtml = (data.doctors && data.doctors.length > 0)
      ? data.doctors.map(d => `
          <div class="border border-slate-700 rounded-lg p-3 mb-2 bg-slate-800/50">
            <p class="text-blue-300 font-semibold">${d.name}${d.specialty ? ` — ${d.specialty}` : ''}</p>
            ${d.address ? `<p class="text-slate-300 text-sm mt-1">${d.address}</p>` : ''}
            ${d.phone ? `<p class="text-slate-300 text-sm mt-1"><a href="tel:${formatPhoneForTel(d.phone)}" class="text-blue-400 hover:underline">${d.phone}</a></p>` : ''}
          </div>`).join('')
      : `<p class="text-slate-500 text-sm">لا توجد بيانات أطباء مضافة.</p>`;
      
    return `
      <div class="result-card space-y-5 text-right w-full">
        <div>
            <h3 class="text-2xl font-bold text-blue-300">${data.disease_name}</h3>
            <p class="text-slate-300 mt-1">${data.definition}</p>
        </div>

        <div class="space-y-2">
            <h4 class="font-semibold text-lg text-white">الأعراض الشائعة</h4>
            <ul class="list-disc list-inside text-slate-400 pr-4">${data.symptoms.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>
        
        <div class="space-y-2">
            <h4 class="font-semibold text-lg text-white">العلاج المبدئي</h4>
            <p class="text-slate-400">${data.treatment}</p>
        </div>
        
        <div class="space-y-2">
            <h4 class="font-semibold text-lg text-white">الأطباء المتخصصون</h4>
            ${doctorsHtml}
        </div>
        
        <div class="bg-blue-900/40 border border-blue-700 p-3 rounded-lg mt-2">
            <p class="text-sm text-blue-200">${data.note}</p>
        </div>

        <div class="mt-4 text-center">
            <button id="mapsCityBtn" class="inline-block bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
                ${city ? `البحث عن مستشفى في ${city}` : 'البحث عن أقرب مستشفى'}
            </button>
        </div>
      </div>
    `;
  };

  const renderResults = (data) => {
    if (data.type === 'disease') {
      output.innerHTML = createDiseaseCardHTML(data);
      const mapsBtn = document.getElementById('mapsCityBtn');
      if (mapsBtn) {
        mapsBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const city = cityInput.value.trim();
          if (city) {
            openMapsForCity(city);
          } else {
            findNearestHospitalByGeolocation();
          }
        });
      }
    } else {
      output.innerHTML = `<p class="text-center text-yellow-400">${data.answer}</p>`;
    }
  };

  // --- API CALL ---
  const handleAnalysis = async () => {
    const message = msgInput.value.trim();
    const city = cityInput.value.trim();
    if (!message) {
      renderError('الرجاء إدخال الأعراض أولاً.');
      return;
    }

    sendBtn.disabled = true;
    renderLoading();

    try {
      const res = await fetch(`${API_BASE_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, city })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'حدث خطأ من الخادم.');
      }
      
      renderResults(data);

    } catch (err) {
      console.error(err);
      renderError('لا يمكن الوصول للسيرفر. تأكد أن السيرفر يعمل.');
    } finally {
      sendBtn.disabled = false;
    }
  };

  // --- EVENT LISTENERS ---
  sendBtn.addEventListener('click', handleAnalysis);
  geoBtn.addEventListener('click', findNearestHospitalByGeolocation);

</script>
</body>
</html>
